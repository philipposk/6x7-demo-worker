name: render

# Triggered per job by the platform (demo.6x7.gr) via the GitHub API.
# Free compute — Ubuntu runners ship ffmpeg; Playwright installs at runtime.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "demo.jobs UUID to render"
        required: true
        type: string

concurrency:
  group: render-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify ffmpeg
        run: ffmpeg -version | head -1

      - name: Install worker deps
        run: npm install --no-audit --no-fund

      - name: Render job
        env:
          TOOLS_DIR: ${{ github.workspace }}/tools
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node worker.mjs --job=${{ github.event.inputs.job_id }}
